<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <a class="page-link" href="{{ '/' | relative_url }}">首页</a>
        <a class="page-link" href="{{ '/about/' | relative_url }}">关于</a>
        <a class="page-link" href="{{ '/categories/' | relative_url }}">分类</a>
        <a class="page-link" href="{{ '/api.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <div class="footer-content">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} · AI工具测评 · <a href="/about/">关于</a></p>
      </div>
    </div>
  </footer>

</body>
</html>
