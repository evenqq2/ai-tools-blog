---
title: AI工具测评
email: admin@even.us.kg
description: >-
  专业的AI工具测评与基准测试平台。提供ChatGPT、Claude、Gemini、DeepSeek、Kimi等主流大模型的综合能力评测、价格对比、应用场景推荐。
baseurl: ""
url: "https://www.even.us.kg"
domain: "www.even.us.kg"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

# SEO
google_analytics: ""
google_adsense: ""

# Affiliate
affiliate:
  taobao_pid: ""
  jd_union_id: ""
  amazon_tag: ""

# Pagination
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title: ":title - 第 :num 页"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# Collections
collections:
  benchmarks:
    output: true
    permalink: /benchmarks/:name/
  models:
    output: true
    permalink: /models/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "AI工具测评"
      lang: zh-CN
      reading_time: true
  - scope:
      path: ""
      type: "benchmarks"
    values:
      layout: "benchmark"
  - scope:
      path: ""
      type: "models"
    values:
      layout: "model"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - scripts/
  - generate_posts.py
  - .github/
  - CNAME
  - LICENSE

# Compress HTML
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

# Sass
sass:
  style: compressed

# kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true